name: evidence

on: [push, pull_request]

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.18.0', '22.9.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: make test
